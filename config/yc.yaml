# Y Combinator startup directory (public browse pages, no login, robots.txt checked).
# Lists are paths under https://www.ycombinator.com/companies/ , for example
#   location/india, industry/saas, industry/developer-tools, industry/b2b
lists:
  - location/india
max_pages_per_list: 10

# Only companies from this batch year on, still active, with a website.
min_batch_year: 2019

# A company is kept when it has at least one "include" tag and no "exclude" tag.
# Include: software or digital products, which a merchant of record fits.
include_tags:
  - b2b
  - saas
  - ai
  - generative-ai
  - ai-assistant
  - developer-tools
  - api
  - productivity
  - education
  - elearning
  - edtech
  - ai-enhanced-learning
  - recruiting
  - sales
  - hr-tech
  - human-resources
  - no-code
  - workflow-automation
  - open-source
  - video
  - infrastructure
  - enterprise
  - analytics
  - design-tools
  - marketing
  - legal
  - security
  - consumer
# Exclude: payment and finance companies (competitors or partners, not leads), and physical goods or services.
exclude_tags:
  - fintech
  - payments
  - banking-as-a-service
  - insurance
  - investing
  - consumer-finance
  - finance
  - crypto-web3
  - income-share-agreements
  - grocery
  - delivery
  - logistics
  - retail
  - hardware
  - hard-tech
  - manufacturing
  - medical-devices
  - robotics
  - construction
  - real-estate
  - housing
  - proptech
  - electric-vehicles
  - warehouse-management-tech
  - supply-chain
  - diagnostics
  - consumer-health-services
  - nonprofit
