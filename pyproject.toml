[project]
name = "dodo-lead-audit"
version = "0.1.0"
description = "Finds SaaS companies likely to need a Merchant of Record and writes payment audits."
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45",
  "httpx>=0.27",
  "pyyaml>=6",
  "sqlmodel>=0.0.21",
  "typer>=0.12",
  "python-dotenv>=1",
  "groq>=0.11",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "truststore>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
